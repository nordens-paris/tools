# Render blueprint (https://render.com/docs/blueprint-spec): one free web service.
# Sims run in the visitors' browsers, so the server only fetches and analyses logs.
services:
  - type: web
    name: parse-mirror
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GAME
        value: tbc-anniversary
      - key: SIM_MODE
        value: browser
      # Healer and tank analyses fetch several raids' logs: only on visitors' own keys here.
      - key: ROLES_NEED_OWN_KEY
        value: "true"
      # Set in the Render dashboard (never in git).
      - key: WCL_API_KEY
        sync: false

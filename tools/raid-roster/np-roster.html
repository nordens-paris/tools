<meta charset="utf-8">
<title>NP Roster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim top bar with segmented tabs; one working column of panels; raid boards hold a grid of 5-man groups. */
:root {
  --bg: #f4f7fa;
  --surface: #ffffff;
  --raised: #ffffff;
  --sunk: #eef2f6;
  --line: #e0e6ec;
  --line-strong: #cdd5de;
  --fg: #141a21;
  --fg-2: #37414d;
  --muted: #687482;
  --faint: #a0aab6;
  --accent: #1a86cf;
  --accent-hover: #1374b5;
  --accent-fg: #ffffff;
  --accent-soft: #e2f1fb;
  --ok: #187a43;
  --ok-soft: #e5f4ea;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --bad: #c42b2b;
  --bad-soft: #fbe7e7;
  --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 1px 1px rgba(20, 20, 30, .03);
  --shadow-lg: 0 10px 30px rgba(20, 20, 30, .12), 0 2px 6px rgba(20, 20, 30, .06);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r: 8px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e12; --surface: #12171d; --raised: #181e26; --sunk: #0e1217; --line: #222a34; --line-strong: #313b47;
    --fg: #e9eef4; --fg-2: #c3ccd6; --muted: #8794a3; --faint: #56616e;
    --accent: #6cc3ff; --accent-hover: #8fd1ff; --accent-fg: #06121c; --accent-soft: #10273a;
    --ok: #5fd08a; --ok-soft: #13291c; --warn: #f0b44c; --warn-soft: #2e2413; --bad: #f47474; --bad-soft: #321718;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e12; --surface: #12171d; --raised: #181e26; --sunk: #0e1217; --line: #222a34; --line-strong: #313b47;
  --fg: #e9eef4; --fg-2: #c3ccd6; --muted: #8794a3; --faint: #56616e;
  --accent: #6cc3ff; --accent-hover: #8fd1ff; --accent-fg: #06121c; --accent-soft: #10273a;
  --ok: #5fd08a; --ok-soft: #13291c; --warn: #f0b44c; --warn-soft: #2e2413; --bad: #f47474; --bad-soft: #321718;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
/* Only the content widens on table tabs; the header keeps its width so the tabs never move. */
body.wide main.wrap { max-width: 1760px; }
/* Room for the scrollbar is always kept, so tabs with and without scrolling line up. */
html { scrollbar-gutter: stable; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.brand svg { color: var(--accent); flex: none; }
.brand .emblem { width: 36px; height: auto; display: block; margin: -4px 0; }
.brand small { font-weight: 400; color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 2px; padding: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; }
nav.tabs a { font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 6px; }
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { background: var(--raised); color: var(--fg); box-shadow: var(--shadow); }
.conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.off { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.dot.busy { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .35; } }

main { padding-block: 24px 96px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
h2 { font-size: 17px; }
h3 { font-size: 16px; }
.eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sub { font-size: 13px; color: var(--muted); max-width: 72ch; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel-head > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* controls */
button, .btn { font: 500 13px/1 var(--sans); height: 32px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); padding: 0 12px; border-radius: var(--r); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; text-decoration: none; white-space: nowrap; box-shadow: var(--shadow); }
button:hover, .btn:hover { background: var(--sunk); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger { color: var(--bad); }
button.ghost { border-color: transparent; background: transparent; box-shadow: none; }
button.ghost:hover { background: var(--sunk); }
button.sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: var(--r-sm); }
button.icon { width: 28px; padding: 0; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible, td.st:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: 13px var(--sans); color: var(--fg); background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 0 10px; height: 32px; min-width: 0; }
select { padding-right: 6px; }
input[type="checkbox"] { height: auto; accent-color: var(--accent); width: 15px; height: 15px; }
textarea { font: 12px/1.5 var(--mono); width: 100%; min-height: 110px; resize: vertical; padding: 10px; height: auto; background: var(--sunk); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
label.f .small { font-weight: 400; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.seg button { border: 0; border-radius: 0; box-shadow: none; }
.seg button + button { border-left: 1px solid var(--line-strong); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; height: 22px; padding: 0 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h2 { color: var(--fg); }
.scroll-x { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
tbody tr:hover td { background: var(--sunk); }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td input, td select { height: 28px; }
/* Log: one row per change, with the parts it touched and its undo/restore buttons. */
.logtable td.change { white-space: normal; min-width: 280px; }
.logtable .ctext { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.logtable .areas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.logtable .areas span { font-size: 11px; color: var(--muted); background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 18px; }
.logtable td.acts { text-align: right; }
.logtable td.acts button + button { margin-left: 4px; }
.logtable tr.gone td.change .ctext { color: var(--muted); }
.logtable tr.hl td { background: var(--warn-soft); }
.logtable tr.hl:hover td { background: var(--warn-soft); }

/* class colours: Blizzard's palette as a small swatch, readable in both themes */
.c-Warrior { --cc: #C69B6D; } .c-Paladin { --cc: #F48CBA; } .c-Hunter { --cc: #AAD372; } .c-Rogue { --cc: #E6D24A; }
.c-Priest { --cc: #C9CDD4; } .c-Shaman { --cc: #0070DD; } .c-Mage { --cc: #3FC7EB; } .c-Warlock { --cc: #8788EE; } .c-Druid { --cc: #FF7C0A; }
.ci { width: 18px; height: 18px; border-radius: 4px; background: var(--cc, var(--sunk)); display: inline-block; flex: none; object-fit: cover; box-shadow: 0 0 0 1.5px var(--cc, var(--line)); }
.c-Priest { --cc: #E9ECF0; } .c-Rogue { --cc: #F2DF4C; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--cc, var(--faint)); display: inline-block; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset; }
.who { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* week toolbar */
.weekbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; justify-content: space-between; }
.weekbar .title { display: flex; flex-direction: column; gap: 4px; }
.weekbar .title select { font-size: 15px; font-weight: 600; height: 36px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; height: auto; box-shadow: var(--shadow); font: inherit; color: inherit; align-items: stretch; white-space: normal; }
.sum:hover { border-color: var(--line-strong); background: var(--surface); }
.sum .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sum .name { font-weight: 600; font-size: 14px; }
.sum .when { font-size: 12px; color: var(--muted); }
.sum .big { font: 500 22px/1 var(--mono); letter-spacing: -.02em; }
.sum .big span { color: var(--faint); font-size: 14px; }
.meter { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; display: flex; gap: 2px; }
.meter i { flex: 1; background: var(--line-strong); }
.meter i.on { background: var(--ok); }

/* days */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.day { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--sunk); min-width: 0; }
.day .date { font-weight: 600; font-size: 15px; }
.day .evt { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rolecount { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rolecount .rc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.rolecount .rc .l { font-size: 11px; color: var(--muted); }
.rolecount .rc .v { font: 500 15px/1 var(--mono); }
.rolecount .rc .v small { font-size: 11px; color: var(--faint); margin-left: 3px; }
.daytags { display: flex; gap: 6px; flex-wrap: wrap; }

/* availability grid */
.grid-av td.st { padding: 4px 8px; }
.ptable th { white-space: normal; vertical-align: bottom; line-height: 1.3; }
.ptable td, .ptable th { padding: 6px 7px; }
.ptable td.discord { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.ptable .w-char { width: 140px; }
.ptable .w-parse { width: 58px; }
.ptable .w-notes { width: 104px; }
.tankbox { display: inline-flex; gap: 14px; align-items: center; padding-right: 6px; }
.tankbox label { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--fg-2); cursor: pointer; }
.stsel { height: 26px; min-width: 124px; font-size: 12px; font-weight: 500; border: 1px solid transparent; border-radius: 6px; padding: 0 6px; cursor: pointer; }
.stsel:hover { border-color: var(--line-strong); }
.stsel option { background: var(--raised); color: var(--fg); }
.sd { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 64px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.sd-yes { background: transparent; color: var(--fg-2); }
.legend .sd-yes { box-shadow: inset 0 0 0 1px var(--line); }
.sd-late, .sd-tentative { background: var(--warn-soft); color: var(--warn); }
.sd-bench { background: var(--accent-soft); color: var(--accent); }
.sd-absence { background: var(--bad-soft); color: var(--bad); }
.sd-none { color: var(--muted); background: var(--sunk); }
.legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.legend .sd { min-width: 0; height: 20px; font-size: 11px; }

/* suggestions */
.sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.opt { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.opt.best { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.opt .dayline { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.opt .dayline:first-of-type { border-top: 0; padding-top: 0; }
.opt .rline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.opt .miss { font-size: 12px; color: var(--muted); }

/* raid board */
.raid { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); scroll-margin-top: 80px; }
.raid > .head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.raid > .head h3 { font-size: 17px; margin-right: 4px; }
.raid > .head .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.raid > .body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.buffs { display: flex; flex-wrap: wrap; gap: 6px; }
.buffs { gap: 4px 12px; }
.buff { font-size: 12px; height: 22px; padding: 0; border-radius: 6px; display: inline-flex; gap: 4px; align-items: center; border: 1px solid transparent; color: var(--muted); background: transparent; }
.buff svg { flex: none; }
.buff.ok svg { color: var(--ok); }
.buff.miss { background: var(--bad-soft); color: var(--bad); padding: 0 8px 0 6px; font-weight: 500; }
.buff .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.buff.miss .n { color: inherit; }
.groups { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 10px; }
@media (max-width: 960px) { .groups { grid-template-columns: repeat(min(var(--cols, 4), 2), minmax(0, 1fr)); } }
@media (max-width: 540px) { .groups { grid-template-columns: minmax(0, 1fr); } }
.zone { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-height: 64px; background: var(--sunk); min-width: 0; transition: border-color .12s, background .12s; }
.zone.over { border-color: var(--accent); background: var(--accent-soft); }
.zone .zt { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; padding: 2px 4px 4px; }
.zone .slot { height: 32px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); opacity: .6; }
.zone.bench { flex-direction: row; flex-wrap: wrap; align-items: flex-start; background: transparent; border-style: dashed; border-color: var(--line-strong); }
.zone.bench .zt { width: 100%; }
.chip { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 7px; border-radius: var(--r-sm); background: var(--raised); border: 1px solid var(--line); cursor: grab; font-size: 13px; min-width: 0; user-select: none; box-shadow: var(--shadow); }
.chip:hover { border-color: var(--line-strong); }
.chip:active { cursor: grabbing; }
.zone.bench .chip { flex: 0 1 auto; }
.chip .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .sp { color: var(--muted); font-size: 12px; white-space: nowrap; }
.chip .ic { margin-left: auto; display: flex; gap: 4px; align-items: center; color: var(--faint); }
.chip.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip.off .sp { color: var(--warn); }
.chip.unavail { opacity: .5; border-style: dashed; }
.tag { font-size: 10px; font-weight: 600; letter-spacing: .02em; padding: 1px 5px; border-radius: 4px; background: var(--sunk); color: var(--muted); text-transform: uppercase; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.role { font: 500 10px/1 var(--mono); width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--sunk); color: var(--muted); }
.why { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; padding: 10px 2px 0; }
.why b { color: var(--fg); font-weight: 500; }
details > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
details.big > summary { font-size: inherit; color: var(--fg); }

/* selection bar */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: min(980px, calc(100vw - 32px)); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); }
.selbar .in { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; }
.selbar .nm { font-weight: 600; }
.selbar .sep { width: 1px; height: 20px; background: var(--line); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(68px + env(safe-area-inset-top, 0px)); z-index: 9; background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow-lg); display: flex; gap: 12px; align-items: center; }
.toast button { height: 24px; font-size: 12px; background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); box-shadow: none; }
.rosterimg { width: 100%; max-width: 1080px; border-radius: 10px; border: 1px solid var(--line); display: block; }
/* bench decision */
details.decide { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
details.decide > summary { gap: 10px; flex-wrap: wrap; }

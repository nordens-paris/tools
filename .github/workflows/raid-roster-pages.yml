# Publishes NP Roster (tools/raid-roster) to GitHub Pages at https://nordens-paris.github.io/tools/raid-roster/
# whenever it changes on main. Lives in .github/workflows/ in the repo.
name: NP Roster on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/raid-roster/**'
      - '.github/workflows/raid-roster-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 tools/raid-roster/web/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
